[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recast-woof-nam"
version = "0.2.0"
description = "GPU port of the NOAA/NCEP NAM (NMMB dynamics + NAM physics) 12 km CONUS parent"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Recast Systems" }]
dependencies = [
    "cupy-cuda13x[ctk]",   # [ctk]: the CUDA headers NVRTC needs to compile the kernels
    "numpy",
    "scipy",
    "netCDF4",
    "Pillow",
    "gpuwm>=2.9.13",   # the ArWen schemes the physics options run (RUC, MYNN, RRTMGP, RRTMG, GF, New Tiedtke, YSU, Noah-MP)
    # NCCL for --cards N (the halo exchange): CuPy loads libnccl.so.2 from this wheel. Without it every several-card
    # run stopped at its first rank (cupy.cuda.nccl has no get_unique_id), on a WOOF box image too (suite proof box)
    "nvidia-nccl-cu13",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU :: NVIDIA CUDA",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.optional-dependencies]
# TEMPO in the NMMB microphysics slot (NAMGPU_MP=tempo) runs gpuwm-hex's column kernel and tables
modern = ["gpuwm-hex>=0.5.0"]

[project.scripts]
woof-nam = "namgpu.cli:main"

[tool.setuptools.packages.find]
include = ["namgpu*"]

# Everything a run reads ships in the wheel: kernels, tables and NOAA fix files (data/), the NAM parm
# files (parm/), the unit list (UNITS.json) and the reused ArWen files (third_party/).
[tool.setuptools.package-data]
namgpu = ["kernels/*.cu", "kernels/*.cuh", "data/**/*", "data/*", "parm/*", "parm/ensembles/*", "products/*.tsv", "io/winter_bridge.rs", "UNITS.json", "third_party/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc"]
