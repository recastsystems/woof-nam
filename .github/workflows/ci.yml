name: ci

# CPU-only checks on every push to main: licence check, import smoke, wheel build.
# No GPU, no secrets, no upload.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: licence check
        run: python tools/licence_check.py

      - name: CPU import smoke (source tree)
        run: |
          python -m pip install --quiet numpy
          PYTHONPATH=. python -c "import namgpu, namgpu.config, namgpu.grid; print('import ok', namgpu.__file__)"
          python tests/test_cli.py
          python tests/test_restart_output.py
          python tests/test_products_spec.py
          python tests/test_products_hiresf.py
          python tests/test_era5_source.py
          python tests/test_rap_source.py
          python tests/test_hrrr_source.py
          python tests/test_basemap.py
          python tests/test_wind_ladder.py
          python tests/test_maps_old_call.py
          python tests/test_pole_frame.py
          python tests/test_seam_frame.py
          python tests/test_maps_dry_window_skip.py
          python tests/test_nest_twoway_default.py
          python tests/test_products_writer.py
          python tests/test_urban_soilw.py

      - name: moving-nest tests (CPU)
        run: |
          python -m pip install --quiet numpy scipy netCDF4 pytest
          PYTHONPATH=. python -m pytest -q -p no:cacheprovider tests/test_follow_bocos.py tests/test_follow_door.py tests/test_follow_prepcap.py tests/test_follow_replay.py tests/test_follow_segment.py tests/test_small_card.py tests/test_helpers.py tests/test_memory_path.py tests/test_nest_door.py tests/test_ncep_nests.py tests/test_coupled_tables.py tests/test_soil_cdf_fetch.py tests/test_ptype.py tests/test_products_inventory.py tests/test_tempo_versions.py tests/test_woof_nam_next_rows.py tests/test_suite_card_share.py tests/test_suite_retry.py tests/test_suite_table.py tests/test_products_run_ctx.py tests/test_suite_no_products.py tests/test_hexdep.py tests/test_ruc_bnu_fetch.py tests/test_run_case_missing.py

      - name: winter/CAD scorer (Rust reader and station statistics)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libnetcdf-dev
          rustc --edition=2021 --test namgpu/io/winter_bridge.rs -o /tmp/winter-tests
          /tmp/winter-tests
          rustc --edition=2021 -O namgpu/io/winter_bridge.rs -o /tmp/rw_namwinter
          NAMGPU_WINTER_BRIDGE=/tmp/rw_namwinter PYTHONPATH=. python -m pytest -q -p no:cacheprovider tests/test_winter_score.py

      - name: pip wheel
        run: python -m pip wheel --no-deps --wheel-dir dist . && ls -l dist

      - name: CPU import smoke (built wheel)
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet numpy
          /tmp/smoke/bin/pip install --quiet --no-deps dist/*.whl
          cd /tmp && /tmp/smoke/bin/python -c "import namgpu, namgpu.config, namgpu.grid; print('wheel import ok', namgpu.__file__)"
          # the wheel alone: the woof-nam command, its package data and the licence notices, no checkout on the path
          cp "$GITHUB_WORKSPACE/tests/test_cli.py" /tmp/test_cli_wheel.py
          cd /tmp && WOOF_NAM_TEST_INSTALLED=1 /tmp/smoke/bin/python /tmp/test_cli_wheel.py
          cp "$GITHUB_WORKSPACE/tests/test_basemap.py" /tmp/test_basemap_wheel.py
          cd /tmp && WOOF_NAM_TEST_INSTALLED=1 /tmp/smoke/bin/python /tmp/test_basemap_wheel.py
          cp "$GITHUB_WORKSPACE/tests/test_products_writer.py" /tmp/test_products_writer_wheel.py
          cd /tmp && WOOF_NAM_TEST_INSTALLED=1 /tmp/smoke/bin/python /tmp/test_products_writer_wheel.py
          cd /tmp && /tmp/smoke/bin/woof-nam --help && /tmp/smoke/bin/woof-nam licence-check
